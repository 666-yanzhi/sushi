[project]
name = "quick-launcher"
version = "0.1.0"
description = "A lightweight Windows application launcher built with PySide6."
requires-python = ">=3.14.4,<3.15"
dependencies = ["PySide6>=6.7,<7"]

[project.scripts]
quick-launcher = "quick_launcher.app:run"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
quick_launcher = ["resources/*.json"]
